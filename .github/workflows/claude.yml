name: Claude

# Answers "@claude" in pull request and issue comments (#133):
#   @claude fix            fix the open review findings (.claude/skills/tsek-fix),
#                          run the checks, push one commit, reply in each thread
#   @claude review         review again (.claude/skills/tsek-review)
#   @claude <question>     answer a question about the change
# Only teammates with write access can trigger it (enforced by the action).
# Pushes are made as the Claude GitHub App, so CI and the review run on them.
#
# Mention @claude in a top-level pull request comment. Review-comment events
# are left out on purpose: GitHub lists their runs among a pull request's
# checks, so every review comment without @claude would show a "skipped"
# check (#93). issue_comment runs are not listed there.

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  pull-requests: write
  issues: write
  id-token: write
  actions: read # lets Claude read CI results

concurrency:
  group: claude-${{ github.event.issue.number }}
  cancel-in-progress: false

jobs:
  claude:
    name: Claude
    # Runs only for comments that mention @claude, so ordinary comments start
    # no runner.
    if: contains(github.event.comment.body, '@claude')
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Check that the token is set
        id: gate
        env:
          HAS_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN != '' }}
        shell: bash
        run: |
          if [[ "$HAS_TOKEN" == "true" ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice title=Claude not run::Add the CLAUDE_CODE_OAUTH_TOKEN repository secret (claude setup-token) to enable @claude."
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Check out the repository
        if: steps.gate.outputs.run == 'true'
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Set up Node.js
        if: steps.gate.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Run Claude
        if: steps.gate.outputs.run == 'true'
        uses: anthropics/claude-code-action@v1
        with:
          claude_code_oauth_token: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          claude_args: |
            --max-turns 80
            --allowedTools "Read,Grep,Glob,Edit,Write,mcp__github_inline_comment__create_inline_comment,Bash(gh pr view:*),Bash(gh pr diff:*),Bash(gh pr comment:*),Bash(gh api:*),Bash(git status:*),Bash(git diff:*),Bash(git log:*),Bash(git show:*),Bash(git merge-base:*),Bash(git rev-parse:*),Bash(git fetch:*),Bash(git add:*),Bash(git commit:*),Bash(git push:*),Bash(npm run setup),Bash(npm run check:*),Bash(npm test:*),Bash(npm run lint:*)"
