name: PR issue link

on:
  pull_request:
    branches:
      - main
    types: [opened, edited, reopened, synchronize]

permissions:
  contents: read

jobs:
  linked-issue:
    name: PR links an issue
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Require a closing keyword for an issue
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        shell: bash
        run: |
          if grep -qiE '\b(close[sd]?|fix(e[sd])?|resolve[sd]?):?[[:space:]]+#[0-9]+' <<< "${PR_BODY:-}"; then
            echo "Linked issue found."
          else
            echo "::error title=No linked issue::Add 'Closes #<issue number>' to the pull request description. Every pull request must close an issue."
            exit 1
          fi
