name: CI and deployment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsek-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a deployment that is already running on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Install, lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Detect application components
        id: components
        shell: bash
        run: |
          if [[ -f frontend/package-lock.json ]]; then
            echo "frontend=true" >> "$GITHUB_OUTPUT"
          else
            echo "frontend=false" >> "$GITHUB_OUTPUT"
          fi

          if [[ -f backend/package-lock.json ]]; then
            echo "backend=true" >> "$GITHUB_OUTPUT"
          else
            echo "backend=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node.js
        if: steps.components.outputs.frontend == 'true' || steps.components.outputs.backend == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        if: steps.components.outputs.frontend == 'true'
        run: npm ci --prefix frontend

      - name: Lint frontend
        if: steps.components.outputs.frontend == 'true'
        run: npm run lint --prefix frontend

      - name: Build frontend
        if: steps.components.outputs.frontend == 'true'
        run: npm run build --prefix frontend

      - name: Install backend dependencies
        if: steps.components.outputs.backend == 'true'
        run: npm ci --prefix backend

      - name: Lint backend
        if: steps.components.outputs.backend == 'true'
        run: npm run lint --if-present --prefix backend

      - name: Build backend
        if: steps.components.outputs.backend == 'true'
        run: npm run build --if-present --prefix backend

      - name: Test backend
        if: steps.components.outputs.backend == 'true'
        run: npm test --if-present --prefix backend

      - name: Report pending components
        if: steps.components.outputs.frontend != 'true' || steps.components.outputs.backend != 'true'
        shell: bash
        run: |
          {
            echo "## Component detection"
            echo ""
            echo "- Frontend present: ${{ steps.components.outputs.frontend }}"
            echo "- Backend present: ${{ steps.components.outputs.backend }}"
            echo ""
            echo "Checks are added automatically when a component has a package-lock.json file."
          } >> "$GITHUB_STEP_SUMMARY"

  staging:
    name: Staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: checks
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  production:
    name: Production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
