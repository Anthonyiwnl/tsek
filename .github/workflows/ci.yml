name: Pull request checks

# Install, lint, build and test (#93). Runs on pull requests into main, and is
# called by deploy-main.yml on every push to main before anything deploys.
# Deploy jobs live in deploy-main.yml, so pull requests never list them as
# skipped.
on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a deployment that is already running on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Install, lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Both apps are always present. A missing lockfile or script must fail
      # the check instead of silently skipping it (#23).
      - name: Check that the frontend and backend are present
        shell: bash
        run: |
          missing=0
          for app in frontend backend; do
            if [[ ! -f "$app/package-lock.json" ]]; then
              echo "::error title=Missing component::$app/package-lock.json not found."
              missing=1
            fi
          done
          exit "$missing"

      # The deploy job uses this script to skip services a merge did not
      # change (#150). Tested here so a broken plan never reaches main.
      - name: Test the deploy plan script
        run: bash .github/scripts/deploy-plan.test.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Lint backend
        run: npm run lint --prefix backend

      # Mocked AI tests (#32): success, timeout, provider errors and malformed
      # output through the real route, extractor and database layer. No API key
      # and no network, so an OpenAI outage or spending limit cannot fail CI.
      # The prompt and schema fingerprints fail here if either changes without
      # a new version. Named on its own so an AI failure is visible at a glance;
      # the full suite below runs these files again.
      - name: Run mocked AI failure tests
        working-directory: backend
        env:
          OPENAI_API_KEY: ""
        run: >-
          node --test
          test/ai-failure-flow.test.js
          test/ai-failure-drill.test.js
          test/extraction.test.js
          test/provider.test.js
          test/analysis.test.js
          test/analysis-http.test.js
          test/application-analyses.test.js

      # No --if-present: if the test script disappears, npm exits with an error.
      - name: Test backend API
        run: npm test --prefix backend
