name: CI and deployment

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tsek-${{ github.workflow }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a deployment that is already running on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  checks:
    name: Install, lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # Both apps are always present. A missing lockfile or script must fail
      # the check instead of silently skipping it (#23).
      - name: Check that the frontend and backend are present
        shell: bash
        run: |
          missing=0
          for app in frontend backend; do
            if [[ ! -f "$app/package-lock.json" ]]; then
              echo "::error title=Missing component::$app/package-lock.json not found."
              missing=1
            fi
          done
          exit "$missing"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test frontend
        run: npm test --prefix frontend

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Lint backend
        run: npm run lint --prefix backend

      # No --if-present: if the test script disappears, npm exits with an error.
      - name: Test backend API
        run: npm test --prefix backend

  staging:
    name: Staging
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: checks
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging
    secrets: inherit

  production:
    name: Production
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
    secrets: inherit
