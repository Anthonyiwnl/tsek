name: Pull request checks

# Install, lint, build and test (#93). Runs on pull requests into main, and is
# called by deploy-main.yml on every push to main before anything deploys.
# Deploy jobs live in deploy-main.yml, so pull requests never list them as
# skipped.
#
# Optimization 5: the checks run as three parallel jobs (frontend, backend,
# mocked AI tests) instead of one job that ran every step in turn, and the
# mocked AI tests run once instead of twice. The slowest job now sets the
# time, not the sum of all of them.
on:
  pull_request:
    branches:
      - main
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: checks-${{ github.event_name }}-${{ github.ref }}
  # Cancel superseded PR runs, but never cancel a deployment that is already running on main.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

env:
  # Mocked AI tests (#32): success, timeout, provider errors and malformed
  # output through the real route, extractor and database layer. They run in
  # their own job, and the backend job skips exactly these files, so each test
  # runs once.
  AI_TEST_FILES: >-
    test/ai-failure-flow.test.js
    test/ai-failure-drill.test.js
    test/extraction.test.js
    test/provider.test.js
    test/analysis.test.js
    test/analysis-http.test.js
    test/application-analyses.test.js

jobs:
  frontend:
    name: Frontend lint, build, and test
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      # A missing lockfile or script must fail the check instead of silently
      # skipping it (#23).
      - name: Check that the frontend is present
        shell: bash
        run: |
          if [[ ! -f frontend/package-lock.json ]]; then
            echo "::error title=Missing component::frontend/package-lock.json not found."
            exit 1
          fi

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        run: npm ci --prefix frontend

      - name: Lint frontend
        run: npm run lint --prefix frontend

      - name: Build frontend
        run: npm run build --prefix frontend

      - name: Test frontend
        run: npm test --prefix frontend

  backend:
    name: Backend lint and API tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Check that the backend is present
        shell: bash
        run: |
          if [[ ! -f backend/package-lock.json ]]; then
            echo "::error title=Missing component::backend/package-lock.json not found."
            exit 1
          fi

      # The deploy job uses this script to skip services a merge did not
      # change (#150). Tested here so a broken plan never reaches main.
      - name: Test the deploy plan script
        run: bash .github/scripts/deploy-plan.test.sh

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      # The production dependency audit uses this gate (#269).
      - name: Test the npm audit gate
        run: node --test .github/scripts/npm-audit-gate.test.mjs

      - name: Install backend dependencies
        run: npm ci --prefix backend

      - name: Lint backend
        run: npm run lint --prefix backend

      # Every backend test file except the mocked AI tests, which have their
      # own job. Fails if an AI test file listed above no longer exists, so a
      # rename can never drop a test from both jobs.
      - name: Test backend API
        working-directory: backend
        shell: bash
        run: |
          for file in $AI_TEST_FILES; do
            if [[ ! -f "$file" ]]; then
              echo "::error title=Missing AI test::$file is listed in AI_TEST_FILES but does not exist."
              exit 1
            fi
          done
          mapfile -t files < <(ls test/*.test.js | grep -vxF -f <(tr ' ' '\n' <<< "$AI_TEST_FILES"))
          if [[ ${#files[@]} -eq 0 ]]; then
            echo "::error title=No backend tests::No backend test files found."
            exit 1
          fi
          node --test "${files[@]}"

  ai-tests:
    name: Mocked AI failure tests
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install backend dependencies
        run: npm ci --prefix backend

      # No API key and no network, so an OpenAI outage or spending limit
      # cannot fail CI. The prompt and schema fingerprints fail here if either
      # changes without a new version.
      - name: Run mocked AI failure tests
        working-directory: backend
        env:
          OPENAI_API_KEY: ""
        run: node --test $AI_TEST_FILES

  # Lighthouse CI (#239): accessibility and best-practices floors on the built
  # landing page and the signed-out sign-in route, so a UI change cannot lower
  # them unnoticed. Runs only on pull requests that change frontend/: a
  # backend-only PR would measure the same pages again, and main runs the same
  # code its PR already checked. Otherwise it passes with a notice instead of
  # being skipped. Thresholds and pages: frontend/lighthouserc.json.
  lighthouse:
    name: Lighthouse accessibility and best practices
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Decide whether the frontend changed
        id: changes
        shell: bash
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          if [[ "$EVENT" == workflow_dispatch ]]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          elif [[ "$EVENT" != pull_request ]]; then
            echo "::notice title=Lighthouse not needed::The pull request for this commit already ran Lighthouse."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            git fetch --quiet --depth=1 origin "$BASE_SHA"
            if git diff --name-only "$BASE_SHA" HEAD | grep -q '^frontend/'; then
              echo "run=true" >> "$GITHUB_OUTPUT"
            else
              echo "::notice title=Lighthouse not needed::This pull request does not change frontend/."
              echo "run=false" >> "$GITHUB_OUTPUT"
            fi
          fi

      - name: Set up Node.js
        if: steps.changes.outputs.run == 'true'
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Install frontend dependencies
        if: steps.changes.outputs.run == 'true'
        run: npm ci --prefix frontend

      - name: Build frontend
        if: steps.changes.outputs.run == 'true'
        run: npm run build --prefix frontend

      - name: Run Lighthouse CI
        if: steps.changes.outputs.run == 'true'
        working-directory: frontend
        run: npx --yes @lhci/cli@0.15.1 autorun

      - name: Upload Lighthouse reports
        if: ${{ always() && steps.changes.outputs.run == 'true' }}
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-report
          path: frontend/lighthouse-report
          retention-days: 14
          if-no-files-found: ignore

  # Branch protection requires a check with this exact name. It passes only if
  # every check job passed. always() makes it run even when a job fails, so a
  # failure shows here as a failure, never as a skipped required check.
  checks:
    name: Install, lint, build, and test
    needs: [frontend, backend, ai-tests, lighthouse]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Require every check job to pass
        shell: bash
        env:
          FRONTEND: ${{ needs.frontend.result }}
          BACKEND: ${{ needs.backend.result }}
          AI_TESTS: ${{ needs.ai-tests.result }}
          LIGHTHOUSE: ${{ needs.lighthouse.result }}
        run: |
          echo "frontend: $FRONTEND, backend: $BACKEND, mocked AI tests: $AI_TESTS, Lighthouse: $LIGHTHOUSE"
          if [[ "$FRONTEND" != success || "$BACKEND" != success || "$AI_TESTS" != success || "$LIGHTHOUSE" != success ]]; then
            echo "::error title=Checks failed::At least one check job did not pass."
            exit 1
          fi
