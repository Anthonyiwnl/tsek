name: AI smoke test

# One small live AI call per day against staging (#78). Unit tests mock the
# provider; this is the only scheduled live call, and it uses the staging key,
# which has a spending limit. It is separate from the deploy pipeline, so an
# AI provider outage never blocks deploying unrelated changes.
on:
  schedule:
    - cron: '43 0 * * *' # daily 08:43 Philippine time
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ai-smoke
  cancel-in-progress: false

jobs:
  smoke:
    name: Live AI call on staging
    runs-on: ubuntu-latest
    timeout-minutes: 8
    environment: staging
    env:
      AI_SMOKE_URL: ${{ vars.AI_SMOKE_URL }}
      AI_SMOKE_NEON_AUTH_URL: ${{ vars.AI_SMOKE_NEON_AUTH_URL }}
      BACKEND_HEALTHCHECK_URL: ${{ vars.BACKEND_HEALTHCHECK_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
    steps:
      - name: Fail when the endpoints are not configured
        if: env.AI_SMOKE_URL == '' || env.AI_SMOKE_NEON_AUTH_URL == '' || env.BACKEND_HEALTHCHECK_URL == '' || env.FRONTEND_URL == ''
        run: |
          {
            echo "## AI smoke test not run"
            echo ""
            echo "- AI_SMOKE_URL configured: ${{ env.AI_SMOKE_URL != '' }} (https://<staging backend>/api/verify)"
            echo "- AI_SMOKE_NEON_AUTH_URL configured: ${{ env.AI_SMOKE_NEON_AUTH_URL != '' }} (staging Neon Auth branch)"
            echo "- BACKEND_HEALTHCHECK_URL configured: ${{ env.BACKEND_HEALTHCHECK_URL != '' }} (https://<staging backend>/health)"
            echo "- FRONTEND_URL configured: ${{ env.FRONTEND_URL != '' }} (staging frontend origin)"
            echo ""
            echo "Set the missing variable in Settings → Environments → staging."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=AI smoke test not run::A staging variable for the AI smoke test is not set."
          exit 1

      # Render's free service sleeps after 15 idle minutes; wake it first so a
      # cold start is not reported as an AI failure.
      - name: Wake the staging backend
        shell: bash
        run: |
          # --fail makes HTTP errors (404, 503) count as failures, so the AI call
          # only runs once the backend answers /health with HTTP 200.
          if ! curl --fail --silent --show-error --max-time 30 --retry 8 --retry-delay 10 --retry-all-errors \
              --output /dev/null "$BACKEND_HEALTHCHECK_URL"; then
            {
              echo "## AI smoke test not run (staging)"
              echo ""
              echo "The staging backend did not answer \`/health\` with HTTP 200 after about 2 minutes of retries,"
              echo "so the AI call was not attempted. This is a backend or hosting problem, not an AI provider result."
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=Staging backend unavailable::/health did not return HTTP 200."
            exit 1
          fi

      # Synthetic input only. Checks the shape of the answer, not its wording,
      # because model output is not deterministic.
      - name: Call the AI verification endpoint
        shell: bash
        env:
          AI_SMOKE_EMAIL: ${{ secrets.AI_SMOKE_EMAIL }}
          AI_SMOKE_PASSWORD: ${{ secrets.AI_SMOKE_PASSWORD }}
        run: |
          auth_failed() {
            {
              echo "## AI smoke test not run (staging)"
              echo ""
              echo "$1"
            } >> "$GITHUB_STEP_SUMMARY"
            echo "::error title=AI smoke authentication failed::$1"
            exit 1
          }
          if [[ -z "$AI_SMOKE_EMAIL" || -z "$AI_SMOKE_PASSWORD" ]]; then
            auth_failed 'Set AI_SMOKE_EMAIL and AI_SMOKE_PASSWORD in the GitHub staging environment.'
          fi

          auth_url="${AI_SMOKE_NEON_AUTH_URL%/}"
          cookies="$(mktemp)"
          trap 'rm -f "$cookies"' EXIT
          if ! jq -nc '{email: env.AI_SMOKE_EMAIL, password: env.AI_SMOKE_PASSWORD, rememberMe: false}' | \
              curl --proto '=https' --fail --silent --max-time 30 --cookie-jar "$cookies" \
                --header "Origin: $FRONTEND_URL" --header 'Content-Type: application/json' \
                --data-binary @- --output /dev/null "$auth_url/sign-in/email"; then
            auth_failed 'The staging test account could not sign in. Check its credentials, Auth branch and trusted origin.'
          fi
          # The server-side JWT endpoint returns a signed token for this session.
          if ! token="$(curl --proto '=https' --fail --silent --max-time 30 --cookie "$cookies" \
                --header "Origin: $FRONTEND_URL" "$auth_url/token" | \
              jq -er '.token | select(type == "string" and test("^[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+\\.[A-Za-z0-9_-]+$"))')"; then
            auth_failed 'Neon Auth did not return a signed JWT for the staging test account.'
          fi
          started=$SECONDS
          status="$(printf 'Authorization: Bearer %s\n' "$token" | \
            curl --proto '=https' --silent --max-time 60 \
            --output response.json --write-out '%{http_code}' \
            --header @- \
            --header 'Content-Type: application/json' \
            --data '{"input":"Synthetic smoke test. Applicant: Juan Dela Cruz. Document: Barangay clearance request. Reply with one short sentence."}' \
            "$AI_SMOKE_URL")" || status=000
          unset token
          seconds=$((SECONDS - started))
          ok=false
          if [[ "$status" == "200" ]] && jq -e '(.result | type == "string" and length > 0) and (.model | type == "string")' response.json > /dev/null 2>&1; then
            ok=true
          fi
          {
            echo "## AI smoke test (staging)"
            echo ""
            echo "| HTTP status | Valid shape | Model | Seconds |"
            echo "|---|---|---|---|"
            echo "| $status | $ok | $(jq -r '.model // "-"' response.json 2>/dev/null || echo -) | $seconds |"
            if [[ "$ok" != "true" ]]; then
              echo ""
              echo "Error code from the backend: \`$(jq -r '.error.code // "none"' response.json 2>/dev/null || echo unreadable)\`."
              echo "If the provider is down, deploys are unaffected. Log an incident if it lasts."
            fi
          } >> "$GITHUB_STEP_SUMMARY"
          [[ "$ok" == "true" ]] || { echo "::error title=AI smoke test failed::HTTP $status from the staging AI endpoint."; exit 1; }
