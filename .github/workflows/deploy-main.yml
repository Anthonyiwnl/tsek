name: CI and deployment

# Runs only on pushes to main (#93): the same checks as pull requests, then
# staging, then production. Production deploys only if staging's smoke test
# passed. Kept out of ci.yml so pull requests never show deploy jobs as skipped.
on:
  push:
    branches:
      - main

permissions:
  contents: read

concurrency:
  group: deploy-main
  # Never cancel a running deployment, and queue every later push instead of
  # replacing the pending one, so each merge gets its own checked run. A run
  # whose commit is no longer the newest on main skips deploying (deploy.yml).
  queue: max
  cancel-in-progress: false

jobs:
  checks:
    name: Checks
    uses: ./.github/workflows/ci.yml

  staging:
    name: Staging
    needs: checks
    uses: ./.github/workflows/deploy.yml
    with:
      environment: staging

  # No "secrets: inherit": deploy.yml reads only the selected GitHub
  # environment's own secrets, so repository secrets stay out of deploy jobs.
  production:
    name: Production
    needs: staging
    uses: ./.github/workflows/deploy.yml
    with:
      environment: production
