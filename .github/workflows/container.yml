name: Backend container

# Builds the backend image and runs it against a real PostgreSQL database
# (#79). Path filters skip this workflow when a change cannot affect the
# image, and the GitHub Actions layer cache reuses unchanged layers.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/container.yml'
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'compose.yaml'
      - '.github/workflows/container.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: container-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  image:
    name: Build image and test against PostgreSQL
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image (layer cache)
        id: build
        uses: docker/build-push-action@v6
        with:
          context: backend
          tags: tsek-backend:local
          load: true
          cache-from: type=gha,scope=backend
          cache-to: type=gha,scope=backend,mode=max

      - name: Start PostgreSQL and the API
        run: docker compose up --detach --no-build --wait --wait-timeout 120

      # Integration check against a real database: migrations, seed data and
      # the catalogue API, run from the same image that would ship.
      - name: Check health, readiness and the catalogue API
        shell: bash
        run: |
          curl --fail --silent --show-error http://127.0.0.1:3000/health
          echo
          curl --fail --silent --show-error http://127.0.0.1:3000/health/ready
          echo
          count="$(curl --fail --silent --show-error http://127.0.0.1:3000/api/document-types | jq 'if type == "array" then length else (.data // .documentTypes // []) | length end')"
          echo "Document types returned: $count"
          [[ "$count" -ge 1 ]] || { echo "::error::The catalogue API returned no document types."; exit 1; }

      - name: Show API logs on failure
        if: failure()
        run: docker compose logs --no-color

      - name: Record image size
        if: always()
        shell: bash
        run: |
          size="$(docker image inspect tsek-backend:local --format '{{.Size}}' 2>/dev/null || echo 0)"
          {
            echo "## Backend image"
            echo ""
            echo "| Image | Size (MB) |"
            echo "|---|---|"
            echo "| tsek-backend (node:24-alpine) | $(( size / 1024 / 1024 )) |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Stop containers
        if: always()
        run: docker compose down --volumes
