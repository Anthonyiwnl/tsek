name: CodeRabbit trigger

on:
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read
  pull-requests: write

concurrency:
  group: coderabbit-trigger-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  request-review:
    name: Request CodeRabbit review
    # CodeRabbit no longer reviews public repositories with fewer than 10
    # stars automatically, so every pull request showed "Review skipped:
    # manual review required". This job posts the same comment a teammate
    # would (`@coderabbitai review`) so every pull request still gets a review.
    #
    # It runs on every pull request so it is never "skipped" (#93), and it
    # never fails: Dependabot and fork pull requests get a read-only token and
    # no secrets, so the comment is not posted and the job says why.
    #
    # Token: CODERABBIT_TRIGGER_TOKEN if that secret exists (a fine-grained
    # token limited to this repository with Pull requests: Read and write),
    # otherwise the workflow's own token. Use the secret only if CodeRabbit
    # does not respond to comments posted by github-actions[bot].
    runs-on: ubuntu-latest
    timeout-minutes: 2

    steps:
      - name: Comment "@coderabbitai review"
        env:
          GH_TOKEN: ${{ secrets.CODERABBIT_TRIGGER_TOKEN || github.token }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        shell: bash
        run: |
          if gh pr comment "$PR_NUMBER" --repo "$GITHUB_REPOSITORY" --body "@coderabbitai review"; then
            echo "Requested a CodeRabbit review on pull request #$PR_NUMBER."
          else
            echo "::warning title=CodeRabbit review not requested::This run's token cannot comment on pull requests (Dependabot and fork pull requests get a read-only token). Comment '@coderabbitai review' on the pull request to request a review."
          fi
