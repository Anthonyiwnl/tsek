name: Deploy

# Reusable deployment: called once for staging, then for production only if
# the staging smoke test passed. Each GitHub environment holds its own
# secrets and variables under the same names.
on:
  workflow_call:
    inputs:
      environment:
        description: GitHub environment to deploy (staging or production)
        required: true
        type: string
    # Passed by name from deploy-main.yml (#95). The environment secret with the
    # same name takes precedence inside the job that selects the environment.
    secrets:
      VERCEL_DEPLOY_HOOK_URL:
        required: false
      RENDER_DEPLOY_HOOK_URL:
        required: false

permissions:
  contents: read

jobs:
  # One job per environment: deploy, then smoke test (#99). They used to be two
  # jobs, and each extra job costs several seconds of runner start-up.
  deploy:
    name: Deploy and smoke test
    runs-on: ubuntu-latest
    # Deploy steps ~1 min, plus smoke-test budgets: backend 11 + frontend 7 + database 6.
    timeout-minutes: 27
    environment: ${{ inputs.environment }}
    env:
      VERCEL_DEPLOY_HOOK_URL: ${{ secrets.VERCEL_DEPLOY_HOOK_URL }}
      RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
      FRONTEND_URL: ${{ vars.FRONTEND_URL }}
      BACKEND_HEALTHCHECK_URL: ${{ vars.BACKEND_HEALTHCHECK_URL }}
      DATABASE_CHECK_URL: ${{ vars.DATABASE_CHECK_URL }}

    steps:
      # Deploy hooks build the newest commit on main, not a chosen commit.
      # If main has moved on, the newer run deploys and tests that commit instead.
      - name: Check that this commit is still the newest on main
        id: current
        shell: bash
        run: |
          head="$(git ls-remote "https://github.com/${GITHUB_REPOSITORY}.git" refs/heads/main | cut -f1)"
          if [[ "$head" == "$GITHUB_SHA" ]]; then
            echo "current=true" >> "$GITHUB_OUTPUT"
          else
            echo "current=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Deployment skipped::main is now at ${head:0:7}; the run for that commit deploys it."
          fi

      # A deployment that did not happen must not look like a successful one
      # (#13, INC-02). Checked before either hook runs, so a half-configured
      # environment never gets a partial deploy.
      - name: Fail when a deployment hook is missing
        if: steps.current.outputs.current == 'true' && (env.VERCEL_DEPLOY_HOOK_URL == '' || env.RENDER_DEPLOY_HOOK_URL == '')
        shell: bash
        run: |
          {
            echo "## Deployment not run (${{ inputs.environment }})"
            echo ""
            if [[ -z "$VERCEL_DEPLOY_HOOK_URL" ]]; then
              echo "- VERCEL_DEPLOY_HOOK_URL is not configured."
            fi
            if [[ -z "$RENDER_DEPLOY_HOOK_URL" ]]; then
              echo "- RENDER_DEPLOY_HOOK_URL is not configured."
            fi
            echo ""
            echo "Nothing was deployed: both hooks are checked before either one runs."
            echo "Add the missing secrets in Settings → Environments → ${{ inputs.environment }} (see docs/STAGING.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Deployment not run::${{ inputs.environment }} is missing a deploy hook secret. See the job summary."
          exit 1

      # An unverified release must not look like a verified one (#13, INC-02).
      # Checked before any hook runs, so nothing deploys unless it can be verified.
      - name: Fail when a verification URL is missing
        if: steps.current.outputs.current == 'true' && (env.FRONTEND_URL == '' || env.BACKEND_HEALTHCHECK_URL == '' || env.DATABASE_CHECK_URL == '')
        shell: bash
        run: |
          {
            echo "## Smoke test not run (${{ inputs.environment }})"
            echo ""
            echo "- FRONTEND_URL configured: ${{ env.FRONTEND_URL != '' }}"
            echo "- BACKEND_HEALTHCHECK_URL configured: ${{ env.BACKEND_HEALTHCHECK_URL != '' }}"
            echo "- DATABASE_CHECK_URL configured: ${{ env.DATABASE_CHECK_URL != '' }}"
            echo ""
            echo "Add the missing variables in Settings → Environments → ${{ inputs.environment }} (see docs/STAGING.md)."
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::error title=Smoke test not run::${{ inputs.environment }} is missing a verification URL. See the job summary."
          exit 1

      # A re-run of this job for a commit that is already live must not trigger
      # new builds whose completion the smoke test could not tell apart (#99).
      - name: Check whether this commit is already live
        id: live
        if: steps.current.outputs.current == 'true'
        shell: bash
        run: |
          backend="$(curl --silent --max-time 15 "$BACKEND_HEALTHCHECK_URL" || true)"
          frontend="$(curl --silent --max-time 15 "$FRONTEND_URL" || true)"
          if jq -e --arg c "$GITHUB_SHA" '.commit == $c' <<< "$backend" > /dev/null 2>&1 \
             && grep -q "name=\"tsek-commit\" content=\"$GITHUB_SHA\"" <<< "$frontend"; then
            echo "live=true" >> "$GITHUB_OUTPUT"
            echo "::notice title=Already live::${{ inputs.environment }} already serves ${GITHUB_SHA:0:7}; hooks not called, smoke test re-checks it."
          else
            echo "live=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Trigger Vercel frontend deployment
        if: steps.current.outputs.current == 'true' && steps.live.outputs.live != 'true' && env.VERCEL_DEPLOY_HOOK_URL != ''
        # A hook call is a single quick request; never let a stalled one hold the pipeline.
        timeout-minutes: 2
        run: curl --fail-with-body --silent --show-error --max-time 60 --request POST "$VERCEL_DEPLOY_HOOK_URL"

      - name: Trigger Render backend deployment
        if: steps.current.outputs.current == 'true' && steps.live.outputs.live != 'true' && env.RENDER_DEPLOY_HOOK_URL != ''
        # A hook call is a single quick request; never let a stalled one hold the pipeline.
        timeout-minutes: 2
        run: curl --fail-with-body --silent --show-error --max-time 60 --request POST "$RENDER_DEPLOY_HOOK_URL"

      # Both checks pass only when the deployed release reports this run's
      # commit, so an older release that is still answering cannot pass.
      - name: Wait for the backend to serve this commit
        if: steps.current.outputs.current == 'true' && env.BACKEND_HEALTHCHECK_URL != ''
        timeout-minutes: 11
        shell: bash
        run: |
          # Render free services sleep and rebuild slowly: poll for up to 10 minutes.
          deadline=$((SECONDS + 600))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            body="$(curl --fail --silent --show-error --max-time 20 "$BACKEND_HEALTHCHECK_URL" || true)"
            if jq -e --arg commit "$GITHUB_SHA" '.commit == $commit' <<< "$body" > /dev/null 2>&1; then
              echo "Backend is healthy on commit $GITHUB_SHA."
              exit 0
            fi
            if [[ -z "$body" ]]; then
              echo "Attempt $attempt: backend is not responding yet."
            elif grep -q '"commit"' <<< "$body"; then
              echo "Attempt $attempt: backend is up but still serving an older commit."
            else
              echo "Attempt $attempt: /health does not report a commit yet."
            fi
            sleep 10
          done
          echo "::error::The ${{ inputs.environment }} backend did not report commit $GITHUB_SHA within 10 minutes. /health must return a \"commit\" field set from RENDER_GIT_COMMIT."
          exit 1

      - name: Wait for the frontend to serve this commit
        if: steps.current.outputs.current == 'true' && env.FRONTEND_URL != ''
        timeout-minutes: 7
        shell: bash
        run: |
          # index.html carries <meta name="tsek-commit">, filled by Vercel at build time.
          deadline=$((SECONDS + 360))
          attempt=0
          while (( SECONDS < deadline )); do
            attempt=$((attempt + 1))
            page="$(curl --fail --silent --show-error --max-time 20 "$FRONTEND_URL" || true)"
            if grep -q "name=\"tsek-commit\" content=\"$GITHUB_SHA\"" <<< "$page"; then
              echo "Frontend is live on commit $GITHUB_SHA."
              exit 0
            fi
            echo "Attempt $attempt: the new frontend is not live yet."
            sleep 10
          done
          echo "::error::The ${{ inputs.environment }} frontend did not report commit $GITHUB_SHA in its tsek-commit meta tag within 6 minutes."
          exit 1

      - name: Verify database-backed endpoint
        if: steps.current.outputs.current == 'true' && env.DATABASE_CHECK_URL != ''
        timeout-minutes: 6
        run: curl --fail --silent --show-error --max-time 20 --retry 10 --retry-delay 10 --retry-all-errors "$DATABASE_CHECK_URL" > /dev/null

