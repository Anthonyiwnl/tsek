name: Evaluation harness

# Runs when the model comparison harness, its prompt or its dataset changes
# (#101). Path filters mean other pull requests do not list this check at all.
on:
  pull_request:
    branches:
      - main
    paths:
      - 'scripts/eval/**'
      - '.github/workflows/eval-harness.yml'
  push:
    branches:
      - main
    paths:
      - 'scripts/eval/**'
      - '.github/workflows/eval-harness.yml'
  workflow_dispatch:
    inputs:
      model:
        description: Model to evaluate live, as provider:model
        default: openai:gpt-4.1-mini
        type: string

permissions:
  contents: read

concurrency:
  group: eval-harness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  eval:
    name: Evaluation harness
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # Only a yes/no reaches the job. The key itself is given to the live step alone.
      HAS_EVAL_KEY: ${{ secrets.OPENAI_EVAL_API_KEY != '' }}
      EVAL_MODEL: ${{ inputs.model || 'openai:gpt-4.1-mini' }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          package-manager-cache: false

      - name: Test the scoring code
        run: node --test scripts/eval/compare-models.test.mjs

      - name: Run a mock comparison
        run: node scripts/eval/compare-models.mjs --models mock:perfect --no-save --min-valid-json 1 --min-outcome 1

      # A merged prompt or dataset change is checked against the real model.
      # It runs only on main (push or manual run), after the tests above pass,
      # so code from an unmerged pull request never runs with the key.
      - name: Evaluate the prompt live
        id: live
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && env.HAS_EVAL_KEY == 'true'
        # 20 requests of at most 30 s each, so the run always ends and saves its report.
        timeout-minutes: 11
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_EVAL_API_KEY }}
        run: node scripts/eval/compare-models.mjs --models "$EVAL_MODEL" --out eval-results --no-warmup --timeout-ms 30000 --min-valid-json 0.95 --min-outcome 0.7

      - name: Explain when the live evaluation runs
        if: steps.live.outcome == 'skipped'
        run: |
          if [[ "$HAS_EVAL_KEY" != "true" ]]; then
            echo "::notice title=Live evaluation not configured::Add the OPENAI_EVAL_API_KEY repository secret (a capped OpenAI key) to evaluate prompt changes against a real model."
          else
            echo "::notice title=Live evaluation runs after merge::The prompt is evaluated against $EVAL_MODEL when this change reaches main."
          fi

      - name: Upload live results
        if: always() && steps.live.outcome != 'skipped'
        uses: actions/upload-artifact@v4
        with:
          name: eval-results
          path: eval-results/
          if-no-files-found: ignore
