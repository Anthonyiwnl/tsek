name: Bug
description: Something that works differently from what it should.
title: "fix: "
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: dropdown
    id: where
    attributes:
      label: Where
      options:
        - Production
        - Staging
        - Pull request preview
        - Local
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      value: |
        1. 
        2. 
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Evidence
      description: Links, screenshots, request IDs (X-Request-Id), or log lines. Never paste secrets or tokens.
