# Weekly dependency update pull requests (#76). Each one still has to pass the
# required checks and get a teammate's review before it can merge.
version: 2
updates:
  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    groups:
      frontend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(frontend)"
    labels: [devops, frontend]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    open-pull-requests-limit: 3
    groups:
      backend-minor-and-patch:
        update-types: [minor, patch]
    commit-message:
      prefix: "chore(backend)"
    labels: [devops, backend]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Asia/Manila
    groups:
      actions:
        patterns: ["*"]
    commit-message:
      prefix: "ci"
    labels: [devops]
