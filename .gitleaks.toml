# Gitleaks configuration (#72). Uses the default rule set and only allowlists
# synthetic fixtures that tests need, such as fake database URLs and fake PEM
# blocks used to test secret redaction. Never allowlist a real secret: rotate it.
title = "TSEK gitleaks config"

[extend]
useDefault = true

[allowlist]
description = "Synthetic test fixtures"
paths = [
  '''(^|/)backend/test/''',
  '''(^|/)frontend/tests/''',
  '''\.test\.m?js$''',
  '''(^|/)\.env\.example$''',
]
